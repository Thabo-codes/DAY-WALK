<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Walk | Enquiry</title>
</head>

<body>

    <header>
        <h1>DAY WALK</h1>
        <p>Step Into Your Everyday Journey</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Have a question about one of our products?
                Complete the form below and we will get back to you.
            </p>

            <form>

                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required>
                <br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <label for="product">Product:</label><br>
                <select id="product" name="product">
                    <option value="">-- Select a product --</option>
                    <option value="sneakers">Sneakers</option>
                    <option value="casual-shoes">Casual Shoes</option>
                    <option value="walking-shoes">Walking Shoes</option>
                    <option value="boots">Boots</option>
                </select>
                <br><br>

                <label for="message">Your Enquiry:</label><br>
                <textarea id="message" name="message" rows="6" cols="40"
                    placeholder="Enter your enquiry here..." required></textarea>
                <br><br>

                <button type="submit">Submit Enquiry</button>
                <button type="reset">Clear Form</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Day Walk. All rights reserved.</p>
    </footer>

</body>
</html>
